<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Rewind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Rift Rewind</h1>
    <p>Are you ready to see your AI-powered match analysis?</p>
    <div id="status-message"></div>
    <form id="request-match-analysis">
      <div>
        <label for="summonerName">Summoner Name: </label>
        <!-- TOOD: change placeholder name between pros-->

        <input
          type="text"
          size="50"
          placeholder="gameName#TAG e.g Peng Yiliang#NA1"
          id="summonerName"
          name="summonerName"
        />
      </div>
      <input id="submit" type="submit" value="Submit" />
    </form>
    <pre id="result"></pre>
    <script src="scripts.js"></script>
  </body>
</html>
